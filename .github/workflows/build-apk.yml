name: Build Ruucho APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Ruucho web app
        run: |
          set -euo pipefail

          mkdir -p vio-android/www

          test -f "vio-final-startup-persistence-complete-1.html" \
            || { echo "::error::Ruucho HTML file not found"; exit 1; }

          cp "vio-final-startup-persistence-complete-1.html" \
             vio-android/www/index.html

          echo "Ruucho HTML prepared successfully."

      - name: Prepare Ruucho branding resources
        run: |
          set -euo pipefail

          test -d "resources" \
            || { echo "::error::resources folder not found"; exit 1; }

          echo "Checking Ruucho branding assets..."

          test -f "resources/ic_launcher.png" \
            || { echo "::error::resources/ic_launcher.png not found"; exit 1; }

          test -f "resources/ic_launcher_round.png" \
            || { echo "::error::resources/ic_launcher_round.png not found"; exit 1; }

          test -f "resources/ic_launcher_foreground.png" \
            || { echo "::error::resources/ic_launcher_foreground.png not found"; exit 1; }

          test -f "resources/ic_launcher_background.png" \
            || { echo "::error::resources/ic_launcher_background.png not found"; exit 1; }

          test -f "resources/ruucho_icon_foreground.png" \
            || { echo "::error::resources/ruucho_icon_foreground.png not found"; exit 1; }

          rm -rf vio-android/resources
          cp -r resources vio-android/resources

          echo "Ruucho branding resources prepared successfully."

      - name: Initialize Node project
        working-directory: vio-android
        run: |
          set -euo pipefail

          npm init -y

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/splash-screen

          echo "Capacitor packages installed."

      - name: Initialize Capacitor
        working-directory: vio-android
        run: |
          set -euo pipefail

          npx cap init Ruucho com.ruucho.app --web-dir www

      - name: Configure Capacitor
        working-directory: vio-android
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require('fs');

          const path = 'capacitor.config.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));

          config.appName = 'Ruucho';
          config.appId = 'com.ruucho.app';
          config.webDir = 'www';

          config.plugins = config.plugins || {};

          config.plugins.SplashScreen = {
            ...(config.plugins.SplashScreen || {}),
            launchAutoHide: false
          };

          fs.writeFileSync(
            path,
            JSON.stringify(config, null, 2) + '\n'
          );

          console.log('Ruucho Capacitor configuration prepared.');
          console.log('SplashScreen launchAutoHide disabled.');
          NODE

      - name: Add Android platform
        working-directory: vio-android
        run: |
          set -euo pipefail

          npx cap add android

      - name: Apply Ruucho launcher icons
        working-directory: vio-android
        run: |
          set -euo pipefail

          RES="android/app/src/main/res"

          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          echo "Removing generated Capacitor launcher resources..."

          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          echo "Installing Ruucho launcher icons..."

          for DIR in \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"
          do
            cp -f "resources/ic_launcher.png" \
              "$DIR/ic_launcher.png"

            cp -f "resources/ic_launcher_round.png" \
              "$DIR/ic_launcher_round.png"
          done

          echo "Ruucho launcher icons installed."

      - name: Apply Ruucho native splash resources
        working-directory: vio-android
        run: |
          set -euo pipefail

          RES="android/app/src/main/res"

          mkdir -p "$RES/drawable"
          mkdir -p "$RES/values"

          test -f "../native-splash/splash.xml" \
            || { echo "::error::native-splash/splash.xml not found"; exit 1; }

          test -f "../native-splash/ruucho_splash_icon_transparent.xml" \
            || { echo "::error::Ruucho splash icon XML not found"; exit 1; }

          test -f "../native-splash/ruucho_splash_colors.xml" \
            || { echo "::error::Ruucho splash colors XML not found"; exit 1; }

          test -f "../native-splash/ruucho_splash_styles.xml" \
            || { echo "::error::Ruucho splash styles XML not found"; exit 1; }

          test -f "../native-splash/merge-ruucho-splash-styles.js" \
            || { echo "::error::Ruucho splash merge script not found"; exit 1; }

          test -f "../resources/ruucho_icon_foreground.png" \
            || { echo "::error::resources/ruucho_icon_foreground.png not found"; exit 1; }

          echo "Installing Ruucho splash assets..."

          rm -f "$RES/drawable/splash.png"

          cp -f "../native-splash/splash.xml" \
            "$RES/drawable/splash.xml"

          cp -f "../native-splash/ruucho_splash_icon_transparent.xml" \
            "$RES/drawable/ruucho_splash_icon_transparent.xml"

          cp -f "../native-splash/ruucho_splash_colors.xml" \
            "$RES/values/ruucho_splash_colors.xml"

          cp -f "../resources/ruucho_icon_foreground.png" \
            "$RES/drawable/ruucho_icon_foreground.png"

          echo "Ruucho native splash resources installed."

      - name: Merge Ruucho native splash theme
        working-directory: vio-android
        run: |
          set -euo pipefail

          STYLES="android/app/src/main/res/values/styles.xml"
          RUUCHO_STYLES="../native-splash/ruucho_splash_styles.xml"

          test -f "$STYLES" \
            || { echo "::error::styles.xml not found"; exit 1; }

          test -f "$RUUCHO_STYLES" \
            || { echo "::error::ruucho_splash_styles.xml not found"; exit 1; }

          python3 - <<'PY'
          from pathlib import Path
          import re

          styles_path = Path(
              "android/app/src/main/res/values/styles.xml"
          )

          ruucho_path = Path(
              "../native-splash/ruucho_splash_styles.xml"
          )

          styles = styles_path.read_text()
          ruucho_styles = ruucho_path.read_text()

          match = re.search(
              r'<style\s+name="AppTheme\.NoActionBarLaunch"[\s\S]*?</style>',
              ruucho_styles
          )

          if not match:
              raise SystemExit(
                  "ERROR: AppTheme.NoActionBarLaunch not found "
                  "in ruucho_splash_styles.xml"
              )

          ruucho_launch_style = match.group(0)

          launch_style_regex = re.compile(
              r'<style\s+name="AppTheme\.NoActionBarLaunch"[\s\S]*?</style>'
          )

          if launch_style_regex.search(styles):
              styles = launch_style_regex.sub(
                  ruucho_launch_style,
                  styles,
                  count=1
              )

              print(
                  "Replaced existing AppTheme.NoActionBarLaunch "
                  "with Ruucho splash style."
              )

          else:
              styles = styles.replace(
                  "</resources>",
                  f"    {ruucho_launch_style}\n</resources>"
              )

              print(
                  "Added AppTheme.NoActionBarLaunch "
                  "with Ruucho splash style."
              )

          styles_path.write_text(styles)
          PY

          echo "Ruucho splash theme merged successfully."

      - name: DEBUG - print generated styles.xml
        working-directory: vio-android
        run: |
          echo "===== styles.xml ====="
          cat android/app/src/main/res/values/styles.xml
          echo "===== end styles.xml ====="

      - name: Patch Android manifest
        working-directory: vio-android
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST" \
            || { echo "::error::AndroidManifest.xml not found"; exit 1; }

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          if "<application" not in text:
              raise SystemExit(
                  "ERROR: <application> tag not found"
              )

          if 'android:enableOnBackInvokedCallback="true"' not in text:
              text = text.replace(
                  "<application",
                  '<application android:enableOnBackInvokedCallback="true"',
                  1
              )

          activity_pattern = re.compile(
              r'<activity\b[^>]*android:name="\.MainActivity"[^>]*>'
          )

          match = activity_pattern.search(text)

          if not match:
              raise SystemExit(
                  'ERROR: <activity android:name=".MainActivity"> not found'
              )

          activity = match.group(0)

          if 'android:theme="@style/AppTheme.NoActionBarLaunch"' not in activity:

              if re.search(
                  r'android:theme="@style/[^"]+"',
                  activity
              ):
                  patched_activity = re.sub(
                      r'android:theme="@style/[^"]+"',
                      'android:theme="@style/AppTheme.NoActionBarLaunch"',
                      activity,
                      count=1
                  )

              else:
                  patched_activity = activity.replace(
                      "<activity",
                      '<activity android:theme="@style/AppTheme.NoActionBarLaunch"',
                      1
                  )

              text = text.replace(
                  activity,
                  patched_activity,
                  1
              )

          path.write_text(text)

          print("AndroidManifest.xml patched successfully.")
          PY

      - name: Install Ruucho MainActivity
        working-directory: vio-android
        run: |
          set -euo pipefail

          MAIN_ACTIVITY="android/app/src/main/java/com/ruucho/app/MainActivity.java"

          test -f "../ci/android-patches/MainActivity.java" \
            || {
              echo "::error::ci/android-patches/MainActivity.java not found"
              exit 1
            }

          mkdir -p "$(dirname "$MAIN_ACTIVITY")"

          cp "../ci/android-patches/MainActivity.java" \
             "$MAIN_ACTIVITY"

          test -f "$MAIN_ACTIVITY" \
            || {
              echo "::error::MainActivity.java was not installed"
              exit 1
            }

          grep -q 'package com\.ruucho\.app;' "$MAIN_ACTIVITY" \
            || {
              echo "::error::MainActivity.java must use package com.ruucho.app"
              exit 1
            }

          grep -q 'VioExitBridge' "$MAIN_ACTIVITY" \
            || {
              echo "::error::MainActivity.java must preserve VioExitBridge compatibility"
              exit 1
            }

          echo "Ruucho MainActivity installed successfully."

      - name: Sync Ruucho with Android
        working-directory: vio-android
        run: |
          set -euo pipefail

          npx cap sync android

      - name: Verify Ruucho Android branding
        working-directory: vio-android
        run: |
          set -euo pipefail

          RES="android/app/src/main/res"

          test -f "$RES/mipmap-mdpi/ic_launcher.png" \
            || { echo "::error::Ruucho launcher icon missing"; exit 1; }

          test -f "$RES/mipmap-mdpi/ic_launcher_round.png" \
            || { echo "::error::Ruucho round launcher icon missing"; exit 1; }

          test -f "$RES/drawable/ruucho_icon_foreground.png" \
            || { echo "::error::Ruucho splash foreground missing"; exit 1; }

          if [ -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" ]; then
            echo "::error::Default adaptive ic_launcher.xml still exists"
            exit 1
          fi

          if [ -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" ]; then
            echo "::error::Default adaptive ic_launcher_round.xml still exists"
            exit 1
          fi

          echo "Ruucho Android branding verified."

      - name: Build Ruucho APK
        working-directory: vio-android/android
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Upload Ruucho APK
        uses: actions/upload-artifact@v4
        with:
          name: Ruucho-debug-APK
          path: vio-android/android/app/build/outputs/apk/debug/app-debug.apk
